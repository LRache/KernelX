name: CI

on:
  push:
  pull_request:

jobs:
  test-riscv64:
    name: Test riscv64 testsuite
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm-slim

    env:
      RUSTUP_HOME: /usr/local/rustup
      CARGO_HOME: /usr/local/cargo

    steps:
      - name: Setup build environment
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            curl wget gnupg ca-certificates lsb-release software-properties-common \
            make cmake ninja-build gcc g++ git python3 xz-utils file \
            gcc-riscv64-linux-gnu g++-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            qemu-system-misc \
          && rm -rf /var/lib/apt/lists/*
          curl -fsSL https://apt.llvm.org/llvm.sh | bash -s -- 21
          rm -rf /var/lib/apt/lists/*
          for tool in clang clang++ ld.lld llvm-objcopy llvm-objdump llvm-ar llvm-nm llvm-strip; do
            ln -sf /usr/bin/${tool}-21 /usr/local/bin/${tool}
          done
          for bin in /usr/bin/riscv64-linux-gnu-*; do
            name=$(basename "$bin")
            ln -sf "$bin" "/usr/local/bin/riscv64-unknown-linux-gnu-${name#riscv64-linux-gnu-}"
          done
          sed -i 's|^# include <gnu/stubs-lp64.h>|//&|' /usr/riscv64-linux-gnu/include/gnu/stubs.h
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain nightly
          export PATH=/usr/local/cargo/bin:$PATH
          rustup target add riscv64gc-unknown-none-elf
          rustup component add rust-src
          echo "/usr/local/cargo/bin" >> $GITHUB_PATH

      - name: Checkout KernelX
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download test image
        run: |
          wget -q https://github.com/LRache/KernelX-testsuit/releases/download/v0.0.1/testsuit-for-oskernel-riscv64.img.xz
          xz -d testsuit-for-oskernel-riscv64.img.xz

      - name: Build kernel
        run: |
          make -f build.mk kernel \
            ARCH=riscv \
            ARCH_BITS=64 \
            CROSS_COMPILE=riscv64-unknown-linux-gnu- \
            KERNELX_RELEASE=5.0 \
            CONFIG_LOG_LEVEL=trace \
            CONFIG_NO_SMP=y \
            CONFIG_WARN_UNIMPLEMENTED_SYSCALL=y \
            COMPILE_MODE=debug

      - name: Run tests in QEMU
        timeout-minutes: 30
        run: |
          timeout 1800 make -f scripts/qemu.mk qemu-run \
            ARCH=riscv \
            ARCH_BITS=64 \
            CONFIG_QEMU_MACHINE=virt \
            CONFIG_QEMU_MEMORY=1G \
            CONFIG_QEMU_CPUS=1 \
            CONFIG_DISK_IMAGE=testsuit-for-oskernel-riscv64.img \
            CONFIG_INITPATH=/testcode/runtest.sh \
            CONFIG_INITCWD=/ \
            CONFIG_ROOT_DEVICE="virtio_mmio@10001000" \
            CONFIG_BOOTARGS="rtc=rtc@101000" \
          | tee qemu_output.log || true

      - name: Check test result
        run: |
          if grep -q '\[PANIC\] Init process exited with code 0, system will halt.' qemu_output.log; then
            echo "Tests passed."
          else
            echo "Tests failed: expected init process exit with code 0."
            tail -50 qemu_output.log
            exit 1
          fi
