name: CI

on:
  push:
  pull_request:

jobs:
  test-riscv64:
    name: Test riscv64 testsuite
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm-slim

    env:
      RUSTUP_HOME: /usr/local/rustup
      CARGO_HOME: /usr/local/cargo

    steps:
      - name: Setup build environment
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            curl wget gnupg ca-certificates lsb-release software-properties-common \
            make cmake ninja-build gcc g++ git python3 xz-utils file e2fsprogs guestfish linux-image-amd64 \
            gcc-riscv64-linux-gnu g++-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            qemu-system-misc \
          && rm -rf /var/lib/apt/lists/*
          curl -fsSL https://apt.llvm.org/llvm.sh | bash -s -- 21
          rm -rf /var/lib/apt/lists/*
          for tool in clang clang++ ld.lld llvm-objcopy llvm-objdump llvm-ar llvm-nm llvm-strip; do
            ln -sf /usr/bin/${tool}-21 /usr/local/bin/${tool}
          done
          for bin in /usr/bin/riscv64-linux-gnu-*; do
            name=$(basename "$bin")
            ln -sf "$bin" "/usr/local/bin/riscv64-unknown-linux-gnu-${name#riscv64-linux-gnu-}"
          done
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain nightly
          export PATH=/usr/local/cargo/bin:$PATH
          rustup target add riscv64gc-unknown-none-elf
          rustup component add rust-src
          echo "/usr/local/cargo/bin" >> $GITHUB_PATH

      - name: Checkout KernelX
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build test image
        run: |
          git clone --branch main https://github.com/LRache/KernelX-testsuit.git
          cd KernelX-testsuit/testsuit-for-oskernel
          ./export_ltp_testcode.py --env riscv --passed
          bash build-guestfish-rv.sh

      - name: Build riscv64 kernel
        run: |
          make -f build.mk kernel \
            ARCH=riscv \
            ARCH_BITS=64 \
            CROSS_COMPILE=riscv64-unknown-linux-gnu- \
            KERNELX_RELEASE=5.0 \
            CONFIG_LOG_LEVEL=trace \
            CONFIG_NO_SMP=y \
            CONFIG_WARN_UNIMPLEMENTED_SYSCALL=y \
            CONFIG_FANOTIFY=y \
            COMPILE_MODE=release \
            SYSROOT=/usr/riscv64-linux-gnu \
            CONFIG_VIRTIO_BLOCK_PAGE_CACHE=n \
            OBJCOPY=llvm-objcopy-21

      - name: Build riscv64 kmodule usertest image
        run: |
          IMG_SIZE=128 ./usertests/build.sh riscv64 kmodule
          test -x usertests/build/riscv64/tests/kmodule/hello
          test -f usertests/build/riscv64/tests/kmodule/hello.ko

      - name: Test riscv64 kmodule usertest
        timeout-minutes: 10
        run: |
          qemu_artifacts="qemu-artifacts/riscv64/kmodule"
          qemu_log="$qemu_artifacts/qemu_output.log"
          qemu_monitor_sock="$qemu_artifacts/qemu-monitor.sock"
          qemu_monitor_log="$qemu_artifacts/qemu_monitor.log"
          qemu_memory_dump="$qemu_artifacts/qemu-memory.vmcore"
          success_marker="Init process exited with status Normal(0), system will halt."
          mkdir -p "$qemu_artifacts"

          python3 scripts/ci_qemu_watchdog.py \
            --idle-timeout 60 \
            --log "$qemu_log" \
            --monitor-socket "$qemu_monitor_sock" \
            --monitor-log "$qemu_monitor_log" \
            --memory-dump "$qemu_memory_dump" \
            --success-marker "$success_marker" \
            --exit-on-success \
            -- \
          qemu-system-riscv64 \
            -M virt \
            -m 1G \
            -nographic \
            -no-shutdown \
            -chardev socket,id=ci_monitor,path="$qemu_monitor_sock",server=on,wait=off \
            -mon chardev=ci_monitor,mode=readline \
            -kernel build/riscv64/Image \
            -drive file=usertests/build/riscv64.ext4,if=none,id=x0,format=raw \
            -device virtio-blk-device,drive=x0,bus=virtio-mmio-bus.0 \
            -smp 1 \
            -append "rtc=rtc@101000 init=/init initcwd=/ root=virtio_mmio@10001000 rootfstype=ext4"

      - name: Test testsuits-for-oskernel-riscv64
        timeout-minutes: 180
        run: |
          qemu_artifacts="qemu-artifacts/riscv64"
          qemu_log="$qemu_artifacts/qemu_output.log"
          qemu_monitor_sock="$qemu_artifacts/qemu-monitor.sock"
          qemu_monitor_log="$qemu_artifacts/qemu_monitor.log"
          qemu_memory_dump="$qemu_artifacts/qemu-memory.vmcore"
          success_marker="Init process exited with status Normal(0), system will halt."
          mkdir -p "$qemu_artifacts"

          tmpdisk="$(mktemp /tmp/qemu-tmpdisk-XXXXXX)"
          trap 'rm -f "$tmpdisk"' EXIT
          truncate -s 1G "$tmpdisk"

          set +e
          python3 scripts/ci_qemu_watchdog.py \
            --idle-timeout 300 \
            --log "$qemu_log" \
            --monitor-socket "$qemu_monitor_sock" \
            --monitor-log "$qemu_monitor_log" \
            --memory-dump "$qemu_memory_dump" \
            --success-marker "$success_marker" \
            --exit-on-success \
            -- \
          qemu-system-riscv64 \
            -M virt \
            -m 1G \
            -nographic \
            -no-shutdown \
            -chardev socket,id=ci_monitor,path="$qemu_monitor_sock",server=on,wait=off \
            -mon chardev=ci_monitor,mode=readline \
            -kernel build/riscv64/Image \
            -drive file=KernelX-testsuit/testsuit-for-oskernel/sdcard-rv.img,if=none,id=x0,format=raw \
            -drive file="$tmpdisk",if=none,id=x1,format=raw \
            -device virtio-blk-device,drive=x0,bus=virtio-mmio-bus.0 \
            -device virtio-blk-device,drive=x1,bus=virtio-mmio-bus.1 \
            -device virtio-net-device,netdev=net0,bus=virtio-mmio-bus.2 \
            -netdev user,id=net0 \
            -smp 1 \
            -append "rtc=rtc@101000 init=/testcode/runtest.sh initcwd=/ root=virtio_mmio@10001000 rootfstype=ext4"
          qemu_status=$?
          set -e

          if [ "$qemu_status" -eq 0 ]; then
            echo "Tests passed."
          elif [ "$qemu_status" -eq 124 ]; then
            echo "Tests failed: QEMU produced no output for 300 seconds."
            tail -50 "$qemu_log" || true
            exit 1
          else
            echo "Tests failed: QEMU status: $qemu_status"
            tail -50 "$qemu_log" || true
            exit 1
          fi

      - name: Upload riscv64 debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-riscv64-debug
          if-no-files-found: warn
          retention-days: 14
          path: |
            qemu-artifacts/riscv64/
            build/riscv64/
            clib/build/riscv64/
            vdso/build/riscv64/
            usertests/build/riscv64.ext4
            KernelX-testsuit/testsuit-for-oskernel/sdcard-rv.img

  test-loongarch64:
    name: Test loongarch64 testsuite
    runs-on: ubuntu-latest
    container:
      image: debian:trixie-slim

    env:
      RUSTUP_HOME: /usr/local/rustup
      CARGO_HOME: /usr/local/cargo

    steps:
      - name: Setup build environment
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            curl wget gnupg ca-certificates lsb-release \
            make cmake ninja-build gcc g++ git python3 xz-utils file e2fsprogs guestfish linux-image-amd64 \
            gcc-loongarch64-linux-gnu g++-loongarch64-linux-gnu binutils-loongarch64-linux-gnu libc6-dev-loong64-cross \
            qemu-system-misc \
          && rm -rf /var/lib/apt/lists/*
          curl -fsSL https://apt.llvm.org/llvm.sh | bash -s -- 21
          rm -rf /var/lib/apt/lists/*
          for tool in clang clang++ ld.lld llvm-objcopy llvm-objdump llvm-ar llvm-nm llvm-strip; do
            ln -sf /usr/bin/${tool}-21 /usr/local/bin/${tool}
          done
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain nightly
          export PATH=/usr/local/cargo/bin:$PATH
          rustup target add loongarch64-unknown-none
          rustup component add rust-src
          echo "/usr/local/cargo/bin" >> $GITHUB_PATH

      - name: Checkout KernelX
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build test image
        run: |
          git clone --branch main https://github.com/LRache/KernelX-testsuit.git
          cd KernelX-testsuit/testsuit-for-oskernel
          ./export_ltp_testcode.py --env loongarch --passed
          bash build-guestfish-la.sh

      - name: Build loongarch64 kernel
        run: |
          make -f build.mk kernel \
            ARCH=loongarch \
            ARCH_BITS=64 \
            CROSS_COMPILE=loongarch64-unknown-elf- \
            RUST_TARGET=loongarch64-unknown-none \
            KERNELX_RELEASE=5.0 \
            CONFIG_LOG_LEVEL=trace \
            CONFIG_NO_SMP=y \
            CONFIG_WARN_UNIMPLEMENTED_SYSCALL=y \
            CONFIG_FANOTIFY=y \
            COMPILE_MODE=release \
            OBJCOPY=llvm-objcopy-21 \
            CONFIG_VIRTIO_BLOCK_PAGE_CACHE=n \
            SYSROOT=/usr/loongarch64-linux-gnu

      - name: Build loongarch64 kmodule usertest image
        run: |
          IMG_SIZE=128 ./usertests/build.sh loongarch64 kmodule
          test -x usertests/build/loongarch64/tests/kmodule/hello
          test -f usertests/build/loongarch64/tests/kmodule/hello.ko

      - name: Test loongarch64 kmodule usertest
        timeout-minutes: 10
        run: |
          qemu_artifacts="qemu-artifacts/loongarch64/kmodule"
          qemu_log="$qemu_artifacts/qemu_output.log"
          qemu_monitor_sock="$qemu_artifacts/qemu-monitor.sock"
          qemu_monitor_log="$qemu_artifacts/qemu_monitor.log"
          qemu_memory_dump="$qemu_artifacts/qemu-memory.vmcore"
          success_marker="Init process exited with status Normal(0), system will halt."
          mkdir -p "$qemu_artifacts"

          python3 scripts/ci_qemu_watchdog.py \
            --idle-timeout 60 \
            --log "$qemu_log" \
            --monitor-socket "$qemu_monitor_sock" \
            --monitor-log "$qemu_monitor_log" \
            --memory-dump "$qemu_memory_dump" \
            --success-marker "$success_marker" \
            --exit-on-success \
            -- \
          qemu-system-loongarch64 \
            -M virt \
            -m 1G \
            -nographic \
            -no-shutdown \
            -chardev socket,id=ci_monitor,path="$qemu_monitor_sock",server=on,wait=off \
            -mon chardev=ci_monitor,mode=readline \
            -kernel build/loongarch64/vmkernelx \
            -drive file=usertests/build/loongarch64.ext4,if=none,id=x0,format=raw \
            -device virtio-blk-pci,drive=x0 \
            -smp 1 \
            -append "init=/init initcwd=/ root=virtio_block0 rootfstype=ext4 rtc=rtc@100d0100 tty=/dev/serial@1fe001e0"

      - name: Test testsuits-for-oskernel-loongarch64
        timeout-minutes: 120
        run: |
          qemu_artifacts="qemu-artifacts/loongarch64"
          qemu_log="$qemu_artifacts/qemu_output.log"
          qemu_monitor_sock="$qemu_artifacts/qemu-monitor.sock"
          qemu_monitor_log="$qemu_artifacts/qemu_monitor.log"
          qemu_memory_dump="$qemu_artifacts/qemu-memory.vmcore"
          success_marker="Init process exited with status Normal(0), system will halt."
          mkdir -p "$qemu_artifacts"

          set +e
          python3 scripts/ci_qemu_watchdog.py \
            --idle-timeout 300 \
            --log "$qemu_log" \
            --monitor-socket "$qemu_monitor_sock" \
            --monitor-log "$qemu_monitor_log" \
            --memory-dump "$qemu_memory_dump" \
            --success-marker "$success_marker" \
            --exit-on-success \
            -- \
          qemu-system-loongarch64 -M virt -m 1G -nographic -smp 1 \
            -no-shutdown \
            -chardev socket,id=ci_monitor,path="$qemu_monitor_sock",server=on,wait=off \
            -mon chardev=ci_monitor,mode=readline \
            -kernel build/loongarch64/vmkernelx \
            -drive file=KernelX-testsuit/testsuit-for-oskernel/sdcard-la.img,if=none,id=x0,format=raw \
            -device virtio-blk-pci,drive=x0 \
            -netdev user,id=net0 \
            -device virtio-net-pci,netdev=net0 \
            -append "init=/testcode/runtest.sh initcwd=/ root=virtio_block0 rootfstype=ext4 rtc=rtc@100d0100 tty=/dev/serial@1fe001e0"
          qemu_status=$?
          set -e

          if [ "$qemu_status" -eq 0 ]; then
            echo "Tests passed."
          elif [ "$qemu_status" -eq 124 ]; then
            echo "Tests failed: QEMU produced no output for 300 seconds."
            tail -50 "$qemu_log" || true
            exit 1
          else
            echo "Tests failed: QEMU status: $qemu_status"
            tail -50 "$qemu_log" || true
            exit 1
          fi

      - name: Upload loongarch64 debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-loongarch64-debug
          if-no-files-found: warn
          retention-days: 14
          path: |
            qemu-artifacts/loongarch64/
            build/loongarch64/
            clib/build/loongarch64/
            vdso/build/loongarch64/
            usertests/build/loongarch64.ext4
            KernelX-testsuit/testsuit-for-oskernel/sdcard-la.img
